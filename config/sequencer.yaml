# robot-sequencer configuration.
#
# Paths are resolved relative to this file's directory unless absolute.
# Values mirror the parameters of the replaced ROS node
# (epics_triggered_sequence) and its production launcher
# (desktop/scripts/launch_epics_sequence.sh).

robot:
  ip: "192.168.192.10"           # UR3e; URSim rehearsal: 192.168.56.101
  urdf: "../model/urdf/ur_with_hande_ur3e.urdf"
  srdf: "../model/srdf/ur.srdf"
  mesh_packages:
    ur_description: "../model/meshes/ur_description"
    robotiq_hande_description: "../model/meshes/robotiq_hande_description"
  group: "ur_manipulator"
  ik_frame: "robotiq_hande_end"
  script_file: "../resources/urscript/external_control.urscript"
  output_recipe: "../resources/urscript/rtde_output_recipe.txt"
  input_recipe: "../resources/urscript/rtde_input_recipe.txt"
  rtde_frequency_hz: 50.0        # state reads only; trajectories go out
                                 # over the trajectory interface. Lower is
                                 # safer: unread packages fill the 131 KB
                                 # socket buffer in 0.5 s at 500 Hz and
                                 # URControl drops the client. Does not
                                 # change the servoj period.

# Planning-time joint limit overrides, ported from
# ur3e_hande_moveit_config/config/joint_limits.yaml. URDF carries no
# acceleration limits and TOTG requires them. Position overrides
# (+-pi on the three non-continuous joints) match the MoveIt config;
# the joints MoveIt marked continuous keep the URDF's +-2pi bounds
# (documented deviation: a strict subset of "continuous", and every
# taught waypoint lies inside it).
joint_limits:
  max_velocity: 3.14159          # rad/s, all six arm joints
  max_acceleration: 1.0          # rad/s^2, all six arm joints
  position_overrides:
    shoulder_lift_joint: [-3.14159, 3.14159]
    elbow_joint: [-3.14159, 3.14159]
    wrist_2_joint: [-3.14159, 3.14159]

epics:
  trigger_pv: "Robot:Trigger"
  start_step_pv: "Robot:StartStep"
  wait_pv: "Robot:Wait"
  holder_pv: "Robot:Holder"
  stop_pv: "Robot:Stop"
  current_step_pv: "Robot:CurrentStep"
  gripper_pv: "Robot:Gripper"
  gripper_rbv_pv: "Robot:Gripper_RBV"
  pause_step_pv: "Robot:PauseStep"
  calib_mode_pv: "Robot:CalibMode"
  loaded_pv: "Robot:Loaded"
  jog_x_pv: "Robot:JogX"
  jog_y_pv: "Robot:JogY"
  jog_z_pv: "Robot:JogZ"
  jog_step_pv: "Robot:JogStep"
  map_source_pv: "Robot:MapSource"

sequence:
  waypoints_yaml: "taught_waypoints.yaml"
  holder_offset: 0.03            # m between holders in Y
  velocity_scale: 1.0
  acceleration_scale: 1.0
  cartesian_translation_step: 0.005   # m, 5 mm interpolation resolution
  cartesian_rotation_step: 0.05       # rad
  cartesian_min_fraction: 0.95        # below this: fall back to planned move
  jog_velocity_scale: 0.1             # calibration jog runs slow
  cartesian_velocity_scale: 0.2       # extra scale on every Cartesian step
                                      # (the approach/insert/extract legs
                                      # around the rack and the stage). The
                                      # planned transits (steps 1/7/18)
                                      # keep velocity_scale.

  # Keep the gripper level through joint-space plans (steps 7 and 18).
  # Those two only constrain the goal, so the planner is free to roll the
  # tool over on the way; measured on the robot, the 63-degree holder-to-
  # stage move swung it to vertical. Cartesian steps interpolate the pose
  # and never had the problem.
  #
  # The constraint is "approach axis stays horizontal", not "orientation
  # stays fixed": the holder is approached along -Y and the stage along
  # +X, 92 degrees apart, so rotation within the horizontal plane must
  # stay free. The taught poses are themselves 1.64 and 0.84 degrees off
  # level, leaving ~1.4 degrees of margin at 3.0.
  level_tool:
    enabled: true
    tolerance_deg: 3.0

gripper:
  # "hande": Robotiq Hand-E over UR tool communication (robot ip:54321).
  # "simulated": no hardware; position tracks commands instantly
  # (URSim has no RS485 device behind 54321).
  mode: "hande"
  open_position: 0.025           # m, open command
  close_position: 0.0            # m, close command (production closes via
                                 # SRDF named target "close" = 0.0; the
                                 # gripper stalls on a gripped sample)
  reach_tolerance: 0.0015        # m, how near the open command counts as
                                 # arrived. Open only: a close has nowhere to
                                 # arrive at, it stops where the object is
  settle_timeout: 5.0            # s
  open_threshold: 0.02           # m, Gripper_RBV open/close boundary
  min_grip_position: 0.002       # m; a sequence close settling narrower than
                                 # this gripped nothing and the step fails.
                                 # Measured 2026-08-19 once the close waited
                                 # for the fingers to stop instead of for a
                                 # position band: a held puck settles at
                                 # 3.9 mm, the pads meeting each other in free
                                 # air at 0.7 mm. The old 8 mm was read off
                                 # band-exit values (11.0-11.4 mm) that a close
                                 # reported whether or not it held anything,
                                 # and it sits ABOVE a real grip.
  grip_force: 0.05               # of the Hand-E's 20-185 N, so ~28 N, just
                                 # above the 20 N register floor. The puck
                                 # hangs in the finger detent, so carrying
                                 # it needs almost nothing, and the softer
                                 # the squeeze the less the puck is sprung
                                 # against its seat (a gripped puck measures
                                 # 0.05 mm of freedom in the seat against a
                                 # free puck's ten times that).
  grip_speed: 0.0                # the Hand-E's own floor, ~20 mm/s. The
                                 # close stalls on the sample, so this is
                                 # the speed the pads arrive at it with;
                                 # the open leaves it at the same pace.
  poll_hz: 50                    # Hand-E background comm rate. The tool-
                                 # comm bridge drops ~1 transaction in a
                                 # few thousand (measured); each cycle is
                                 # two, so a lower rate means fewer stalls.
                                 # The driver also retries a lost one.

# Static collision scene, replacing stage_scene_utils + setup_stage_acm.
#
# The stage is an approximate convex decomposition of resources/stage.stl,
# built by tools/stage_collision (see its module doc). The CAD mesh has
# 231,812 triangles and cost ~150 s of BVH build per daemon start and
# ~930 ms per joint-space plan; these 40 convex parts cost neither
# measurably. They contain the original shape, so they can only report
# more collisions than it, never fewer — the price is that thin
# concavities fill in, and holder1_on_position now reads as a collision.
# Nothing plans into it (the steps that reach it are Cartesian), but a
# joint-space plan into a slot would fail. Regenerate with:
#   cargo run --release --manifest-path ../tools/stage_collision/Cargo.toml \
#     -- ../resources/stage.stl ../resources/stage_parts
# The stage was moved on the rig (2026-09-03) and re-taught by jogging,
# which wrote the move into the seat trims as a tool-frame translation:
# sample_holder_on_position_{x,y,z}_offset moved by (-8.4246, -1.5,
# +4.4842) mm. Turned by the seat's own orientation that is
# [-0.00431, -0.00849, +0.00162] m in the model frame, and every part
# below carries it. A rotation of the stage would not show up this way --
# the trims can only say where one point went, so if the stage was also
# turned, the parts need an rpy change no trim can supply.
#   seat_scan config/sequencer.yaml stage 1 -8.4246,-1.5,4.4842
# prints that conversion against the live geometry.
scene:
  objects:
    - { id: "stage0", stl: "../resources/stage_parts/stage_part00.stl",
        scale: [0.01, 0.01, 0.01], position: [-0.15431, 0.38151, -0.00038], rpy: [0.0, 0.0, 3.14159] }
    - { id: "stage1", stl: "../resources/stage_parts/stage_part01.stl",
        scale: [0.01, 0.01, 0.01], position: [-0.15431, 0.38151, -0.00038], rpy: [0.0, 0.0, 3.14159] }
