# Vision look-then-move fine correction (doc/vision_camera_setup.md).
# Off until the wrist camera + vision node are commissioned; when
# enabled, every Robot:Vision PV must be served and answered, and a
# failed/invalid/over-limit measurement stops the sequence (resume via
# StartStep as with any step failure). observe_only is Phase C: measure
# and log at every hook, never move, never fail.
vision:
  enabled: false
  observe_only: false
  timeout: 2.0            # s to wait for the vision node's answer
  # The deadband filters the arm, not the sensor: 20 production cycles put
  # the re-approach spread at the observation pose at sigma (0.022, 0.007) mm
  # and peak-to-peak (0.095, 0.026) mm, against an estimator floor of
  # 0.001 mm (doc §14). 0.10 sits above the observed spread; the old 0.05
  # sat inside it, so 1 cycle in 20 would have been corrected for nothing.
  min_correction: 0.10    # mm, deadband below which corrections are noise
  max_correction: 3.0     # mm, larger corrections stop the sequence
  # Each hook observes from a standby pose, where the target is near the
  # middle of the frame, and the correction is applied to the above/on
  # pair that follows.
  #
  # The two that are off are off because tools/vision/vision_node.py does
  # not measure them and answers Valid=0 rather than zeros — zeros would
  # read as "aligned" and "seated" and be indistinguishable from a real
  # answer. grip_offset looks at the puck in the fingers, which rides
  # 33 deg off the optical axis with only its near rim inside the frame;
  # seating needs a tilt, and depth on this metal is 1.83 mm biased and
  # 8.48 mm spread. Turning either on without teaching the node how to
  # answer it stops the sequence every cycle, which is the correct
  # failure and not a reason to make the node invent a number.
  pick_align: true        # at steps 1 and 12, applied to 2/3 and 13/14
  grip_offset: false      # at steps 5 and 16 — not measured (§13.2)
  place_align: true       # at steps 7 and 18, applied to 8/9 and 19/20
  seating_check: false    # at steps 12 and 23 — not measured (§12.1)

# Eye-in-hand calibration capture (CalibMode = 3). Commissioning only:
# it produces the T_ee_cam that the vision node above needs before it can
# turn pixels into a TCP-local correction at all. Two triggers: the first
# enters an aiming hold where JogX/Y/Z move the TCP and the tag position
# is logged once a second, the second starts the capture from wherever
# the arm then is. The arm rotates the tool about its own axes, samples
# the tag at each stop, and returns to where it started. Solve with:
#   <solve_python> tools/handeye/solve_joint.py <out_dir>/samples_<timestamp>.yaml
# (the capture logs the exact path it wrote; each one gets its own name so
# a second capture cannot quietly replace the first)
handeye:
  # Two interpreters because no one environment here has both halves: the
  # detector needs pyepics to reach the camera's PVs, the solver needs
  # yaml and scipy, and the pydm env has no yaml.
  python: "/home/bl9b/micromamba/envs/pydm/bin/python3.11"
  solve_python: "/usr/bin/python3"
  detector: "../tools/handeye/detector.py"
  out_dir: "../handeye_samples"
  angle_deg: 16.0         # largest tool rotation; bounded by the tag staying in frame.
                          # 8 deg left t_ee_cam underdetermined: (R_a - I) inverts the
                          # detection noise into the translation, so the methods spread
                          # 2.9 mm while agreeing to 0.03 deg on rotation. 16 halves that
                          # amplification. The ceiling is rx, which walks the tag 5.5 px
                          # per degree down a 480 px frame.
  standoff_mm: [0.0, -50.0, -100.0]
                          # the rotation set repeats at 307 and 357 mm as well as the
                          # aiming 257 mm. At one distance the tag's solvePnP depth error
                          # is the same in every sample and reads as camera mount offset:
                          # the 16 deg run agreed to 2.0 mm between methods while leaving
                          # one out moved the answer 5.6 mm. Only away from the tag —
                          # reproj tracks the tag's pixel size (0.24 px at 128 px, 0.99 at
                          # 174), which is a geometric error on the sheet rather than
                          # detection noise, so closing in makes every sample worse: the
                          # 227 mm group alone spread 7.55 mm against 1.41 at 307 mm.
  velocity_scale: 0.1     # slower than the sequence: every pose is a fresh excursion
  min_samples: 5          # below this the capture is reported failed, not written

# Force-stopped seat probing (CalibMode=5). Two triggers: the first opens a
# jog hold, the second probes from wherever the arm was jogged to. It prints
# where the bore is and writes nothing.
#
# Every number here bounds how hard the arm may push on a sample, so they are
# validated at startup rather than at the trigger.
probe:
  velocity_scale: 0.02    # each step is a move into something that may be there
  bore:                   # the stage bore (CalibMode=5): 0.50 mm radial clearance,
                          # probed with the fingers opened
    loosen_mm: 2.5        # play opened before stepping. A gripped, seated puck
                          # closes the gripper-puck-bore loop and every direction
                          # saturated on the first 0.05 mm step (1.2/1.5/6.3 N,
                          # 2026-08-15) with nothing free in front of it. Half of
                          # this is the free run before a pad touches the puck
                          # again, so it has to beat the nominal 0.50 mm radial
                          # clearance: at 0.3 the free run was 0.2 mm and base
                          # y+ still read 6.008 N. 1.2 dropped that to 0.652 N
                          # but every direction still met something on the first
                          # step, so this doubles it to put the pads out of reach
                          # by a margin. The release runs at the gripper's minimum
                          # force -- it opens into a rack.
    lateral:              # sideways, toward a bore wall
      step_mm: 0.05       # ten steps to the nominal 0.50 mm radial clearance,
                          # and the overshoot past first contact is one of them
      travel_mm: 3.0      # past the clearance, so "no contact" means the bore is
                          # not where the pose says rather than the probe was short.
                          # 1.5 did not reach that: base x- and y+ both ran out with
                          # nothing in front of them (doc §16.7) and the bracket had
                          # no midpoint. This clears the loosened fingers' free run
                          # (loosen_mm/2 = 1.27) plus the nominal 0.50 clearance
      threshold_n: 0.5    # 7x the 0.073 N the arm scatters standing still; reading
                          # force between steps rather than during them is what
                          # makes a threshold this low usable (doc §16.1)
      abort_n: 5.0        # a rubbing insert was measured at 8-23 N. That is the
                          # force this mode exists to stop the sequence applying,
                          # not a level to probe up to.
      overtravel_steps: 3 # steps taken after contact so the wall comes from a
                          # slope, not from the trip point. A bore wall trips in
                          # one step (0.17 -> 0.59 N, doc §16.8) and one sample is
                          # not a slope. 0.15 mm further in at most -- it also
                          # stops at half the abort force, so a stiffer wall costs
                          # samples rather than an aborted run (doc §16.9)
    depth:                # downward, toward the bore floor
      step_mm: 0.10
      travel_mm: 4.0
      threshold_n: 1.0    # the puck's own weight is already on the floor
      abort_n: 8.0
      overtravel_steps: 2 # the 0.4-0.5 N shoulder half a millimetre above the
                          # floor is not the floor: fitting it in halves the slope
                          # and moves the answer 0.2 mm (doc §16.9). Two steps put
                          # a second sample in the hard part; the load bound (half
                          # of abort_n) stops it sooner on a stiff floor

# CalibMode=6, the grip null: drives a holder's taught seat pose to where
# the fingers close on its puck without loading it. It took this slot from
# the seat-probe holder map, which read walls the puck was already pressed
# against and so could not measure the pose error at all.
grip_null:
  stiffness_n_per_mm: [30.0, 37.0, 100.0]
                        # SEED for the first step only, N/mm, in tool x, tool y
                        # (depth) and tool z -- the axes the trims are written
                        # in. At a rack seat tool x is base x, tool y is -base z
                        # and tool z is base y. Measured at two holders (h9 29.4
                        # in tool x and 103 in tool z; h10 28-36 in tool x and
                        # 36.6 in depth, 2026-08-19). After the first step the
                        # loop steers on the slope it measures itself, because a
                        # seed too stiff makes it crawl: h8's tool z took
                        # 0.006 mm a round against a force that did not move.
                        # The middle entry is dormant: depth is steered at
                        # neither seat (NULL_STEERED), so nothing reads it --
                        # it is kept measured, and indexed by tool axis, for
                        # the day that constant changes
  damping: 0.7          # two-point stiffness estimates need margin: at 0.7 the
                        # iteration still contracts with a stiffness wrong by 2x
                        # either way, where 1.0 sits on the edge of oscillating
  settled_n: 0.5        # the noise floor, doing two jobs -- an axis under it is
                        # not written, and a round with no axis over it is done.
                        # A holder that grips clean reads 0.27 N (h4) and a
                        # nulled one settles at 0.29 N (h9); at 29 N/mm that is
                        # 0.010 mm, under the arm's own repeatability
  max_step_mm: 0.5      # h10's first correction, the largest measured, was
                        # 0.36 mm
  max_total_mm: 1.0     # past this the seat is wrong, not the trim: a foreign
                        # object in the well reads exactly like a large steady
                        # force, and so does the wrong puck
  max_iterations: 6     # each is two picks and places, three when the two
                        # closes disagree -- about 70 s, or 105 s when it
                        # splits. The cap bounds a seat that will not
                        # converge, not the clock

# Ask the D405's depth stream whether the seat the arm is about to use is in
# the state the step assumes -- a puck to pick, room to place -- before the
# arm commits. The window and the threshold are measured constants and live
# in src/seatcheck.rs next to the measurement; only what identifies this
# rig's camera is here.
#
# What it is NOT is a clearance check. One pixel is 0.34 mm from a holder
# standby, T_ee_cam's translation is uncertain by 0.45 mm 1-sigma and depth
# noise is +-1 mm, against a rack well whose play is +-0.032 mm. Occupancy is
# a different scale: a seated puck reads 4 mm nearer than its own grasp point
# where an empty well reads 41 mm further (holder 2, loaded then emptied,
# 2026-08-18). Clearance stays with the wrench, which reads 4.4 N at 0.2 mm.
seat_check:
  enabled: true
  hand_eye_yaml: "../T_ee_cam.yaml"
                        # what tools/handeye/solve_joint.py wrote; a remounted
                        # camera means a fresh CalibMode=3 capture and a re-solve
                        # into this file, and nothing else changes
  depth_prefix: "RS405:image2:"
                        # the NDStdArrays plugin carrying the Z16 frame. Its
                        # EnableCallbacks must be on, or no frame ever arrives
  camera_prefix: "RS405:cam1:"
                        # the depth stream's own intrinsics and count scale --
                        # 389.555 and 0.0001 m here, not the colour stream's
  rack_window_bias_mm: [0.0, 0.0, 0.0]
                        # the ten wells keep the window the 2026-08-19
                        # fingerprints were measured with -- unchanged
  stage_window_bias_mm: [0.0, 8.0, 0.0]
                        # the stage was moved on the rig 2026-09-03 and
                        # re-taught into the seat trims. The window follows
                        # the trim, so it moved too, and landed just above
                        # the puck: the seated puck's top edge fell on the
                        # window's last row and the median read the
                        # background 50 mm behind it. Measured against a
                        # seated puck with the arm parked at the wait:
                        #   +0 mm +53.1 (empty)  +2 mm +43.2 (empty)
                        #   +4 mm  -8.2  +6 -7.9  +8 -7.3  +10 -7.3
                        # so the edge is at +3 and the plateau runs past
                        # +10; +8 sits in the middle of it at 74% valid
                        # pixels. It moves the sampling window only -- the
                        # grasp point the median is judged against, and the
                        # pose the arm drives to, are untouched.
                        #   seat_scan config/sequencer.yaml stage 1 bias:0,8,0
                        # re-measures it against a live frame.
  timeout: 5.0          # seconds to wait for a frame exposed after the arm
                        # stopped; a miss warns and lets the run continue
