move_relative_mtc:
  ros__parameters:
    group: ur_arm
    # 기본은 gripper tip 기준. (tool0가 TF에 없거나 prefix가 붙는 경우가 있음)
    ik_frame: robotiq_hande_end
    direction_frame: robotiq_hande_end

    # Move along (dx,dy,dz) direction vector in direction_frame, for distance [m]
    distance: 0.05
    dx: -1.0
    dy: 0.0
    dz: 0.0

    # Cartesian solver
    step_size: 0.005
    vel_scale: 1.0
    acc_scale: 1.0


