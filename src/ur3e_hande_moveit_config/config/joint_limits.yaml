# These limits are used by MoveIt and augment/override the definitions in ur_description.
#
# While the robot does not inherently have any limits on joint accelerations (only on torques),
# MoveIt needs them for time parametrization. They were chosen conservatively to work in most use
# cases. For specific applications, higher values might lead to better execution performance.
#
# IMPORTANT: Position limits are critical for UR robots to prevent joints from exceeding
# safe operating ranges. Continuous joints (shoulder_pan, wrist_1, wrist_3) can rotate freely,
# but shoulder_lift, elbow, and wrist_2 have physical limits around ±180 degrees.

joint_limits:
  shoulder_pan_joint:
    # Continuous joint - no position limits
    has_position_limits: false
    has_velocity_limits: true
    max_velocity: 3.14159  # rad/s (180 deg/s)
    has_acceleration_limits: true
    max_acceleration: 1.0
  shoulder_lift_joint:
    has_position_limits: true
    min_position: -3.14159  # -180 degrees
    max_position: 3.14159   # +180 degrees
    has_velocity_limits: true
    max_velocity: 3.14159
    has_acceleration_limits: true
    max_acceleration: 1.0
  elbow_joint:
    has_position_limits: true
    min_position: -3.14159  # -180 degrees
    max_position: 3.14159   # +180 degrees
    has_velocity_limits: true
    max_velocity: 3.14159
    has_acceleration_limits: true
    max_acceleration: 1.0
  wrist_1_joint:
    # Continuous joint - no position limits
    has_position_limits: false
    has_velocity_limits: true
    max_velocity: 3.14159
    has_acceleration_limits: true
    max_acceleration: 1.0
  wrist_2_joint:
    has_position_limits: true
    min_position: -3.14159  # -180 degrees
    max_position: 3.14159   # +180 degrees
    has_velocity_limits: true
    max_velocity: 3.14159
    has_acceleration_limits: true
    max_acceleration: 1.0
  wrist_3_joint:
    # Continuous joint - no position limits
    has_position_limits: false
    has_velocity_limits: true
    max_velocity: 3.14159
    has_acceleration_limits: true
    max_acceleration: 1.0
  robotiq_hande_left_finger_joint:
    has_position_limits: true
    min_position: 0.0
    max_position: 0.025
    has_velocity_limits: true
    max_velocity: 0.15
    has_acceleration_limits: true
    max_acceleration: 0.5
  robotiq_hande_right_finger_joint:
    has_position_limits: true
    min_position: 0.0
    max_position: 0.025
    has_velocity_limits: true
    max_velocity: 0.15
    has_acceleration_limits: true
    max_acceleration: 0.5
